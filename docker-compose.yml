services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestor-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      # 1434 para no chocar con el sql server de práctica
      - "${DB_PORT:-1434}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  webapp:
    image: gestorfinanzas-web
    container_name: gestor-web
    restart: unless-stopped
    build:
      context: ./src
      dockerfile: GestorFinanzas.Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=${DB_SERVER};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # IA opcional (cualquier servicio compatible con "chat completions"). Vacío = clasificador local de respaldo.
      IA__Endpoint: ${IA_ENDPOINT:-}
      IA__ApiKey: ${IA_API_KEY:-}
      IA__Model: ${IA_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"

volumes:
  sqlserver_data: